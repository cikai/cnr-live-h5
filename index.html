<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>中央人民广播电台</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b31;
      --card-active: #1f2a50;
      --text: #f2f5ff;
      --subtext: #a7b1d1;
      --primary: #4f8cff;
      --primary-pressed: #3c74dd;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1a2550, var(--bg) 36%);
      color: var(--text);
      min-height: 100vh;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    }

    html,
    body {
      min-height: 100dvh;
    }

    html {
      background: radial-gradient(circle at top, #1a2550, var(--bg) 36%);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      padding: 8px 6px 18px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.5;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .station {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .station.active {
      background: var(--card-active);
      border-color: rgba(79, 140, 255, 0.7);
    }

    .station:active {
      transform: scale(0.995);
    }

    .logo {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 12px;
      background: #0f1326;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 6px;
      color: var(--subtext);
      font-size: 13px;
    }

    .btn {
      border: 0;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      min-width: 80px;
      padding: 10px 12px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: var(--primary-pressed);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="header">
      <h1 class="title">中央人民广播电台</h1>
    </section>

    <section class="list" id="stationList"></section>

    <video id="player" class="sr-only" playsinline webkit-playsinline preload="none"></video>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const stations = [
      {
        name: "中国之声",
        logo: "logo/中国之声.jpg",
        stream: "/proxy/zgzs/index.m3u8"
      },
      {
        name: "经济之声",
        logo: "logo/经济之声.png",
        stream: "/proxy/jjzs/index.m3u8"
      },
      {
        name: "音乐之声",
        logo: "logo/音乐之声.png",
        stream: "/proxy/yyzs/index.m3u8"
      },
      {
        name: "经典音乐广播",
        logo: "logo/经典音乐广播.png",
        stream: "/proxy/dszs/index.m3u8"
      },
      {
        name: "中国交通广播",
        logo: "logo/中国交通广播.jpg",
        stream: "/proxy/gsgljtgb/index.m3u8"
      }
    ];

    const listEl = document.getElementById("stationList");
    const player = document.getElementById("player");

    let currentIndex = -1;
    let isPlaying = false;
    let hls = null;

    const canPlayHlsNatively = Boolean(
      player.canPlayType("application/vnd.apple.mpegurl") ||
      player.canPlayType("application/x-mpegURL")
    );

    function canUseHlsJs() {
      return typeof window.Hls !== "undefined" && window.Hls.isSupported();
    }

    function setupHlsErrorHandler(instance) {
      instance.on(window.Hls.Events.ERROR, (_, data) => {
        if (!data || !data.fatal) return;
        isPlaying = false;
        render();
      });
    }

    function disposeHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    async function prepareSource(url) {
      const forceNative = isIosSafari();

      if (canPlayHlsNatively || forceNative) {
        disposeHls();
        player.pause();
        player.removeAttribute("src");
        player.load();
        player.src = url;
        player.load();
        return;
      }

      if (canUseHlsJs()) {
        if (!hls) {
          hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: false
          });
          setupHlsErrorHandler(hls);
          hls.attachMedia(player);
        }
        hls.loadSource(url);
        return;
      }

      throw new Error("当前浏览器不支持 m3u8 播放");
    }

    function render() {
      listEl.innerHTML = stations.map((station, index) => {
        const active = index === currentIndex;
        const statusText = active && isPlaying ? "正在播放" : active ? "已暂停" : "未播放";
        const btnText = active && isPlaying ? "暂停" : "播放";

        return `
          <article class="station ${active ? "active" : ""}" data-index="${index}">
            <img class="logo" src="${station.logo}" alt="${station.name} 图标" loading="lazy" />
            <div class="meta">
              <h2 class="name">${station.name}</h2>
              <p class="status">${statusText}</p>
            </div>
            <button class="btn" type="button" data-action="toggle" data-index="${index}">
              ${btnText}
            </button>
          </article>
        `;
      }).join("");
    }

    function normalizeStreamUrl(url) {
      if (url.startsWith("/")) {
        return `${location.origin}${url}`;
      }
      if (url.startsWith("http://")) {
        return url.replace("http://", "https://");
      }
      return url;
    }

    function isIosSafari() {
      const ua = navigator.userAgent || "";
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
      return isIOS && isSafari;
    }

    async function toggleStation(index) {
      const station = stations[index];
      if (!station) return;
      const streamUrl = normalizeStreamUrl(station.stream);

      try {
        if (currentIndex === index) {
          if (isPlaying) {
            player.pause();
            isPlaying = false;
          } else {
            await player.play();
            isPlaying = true;
          }
        } else {
          currentIndex = index;
          await prepareSource(streamUrl);
          await player.play();
          isPlaying = true;
        }

        updateMediaSession(station);
      } catch (err) {
        isPlaying = false;
        console.error(err);
      } finally {
        render();
      }
    }

    function updateMediaSession(station) {
      if (!("mediaSession" in navigator) || !station) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: station.name,
        artist: "中央广播电台",
        album: "实时直播",
        artwork: [{ src: station.logo, sizes: "192x192", type: "image/png" }]
      });
      navigator.mediaSession.setActionHandler("play", async () => {
        await player.play();
        isPlaying = true;
        render();
      });
      navigator.mediaSession.setActionHandler("pause", () => {
        player.pause();
        isPlaying = false;
        render();
      });
    }

    listEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action='toggle']");
      if (!button) return;
      const index = Number(button.dataset.index);
      toggleStation(index);
    });

    player.addEventListener("pause", () => {
      isPlaying = false;
      render();
    });

    player.addEventListener("playing", () => {
      isPlaying = true;
      render();
    });

    player.addEventListener("error", () => {
      isPlaying = false;
      render();
    });

    document.addEventListener("visibilitychange", () => {
      // iOS Safari 支持后台播放，这里不主动暂停，避免切后台时打断音频。
    });

    render();
  </script>
</body>
</html>
