user root;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /proxy/ {
      proxy_pass https://ngcdn001.cnr.cn/live/;
      proxy_ssl_server_name on;
      proxy_set_header Host ngcdn001.cnr.cn;
      proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1";
      proxy_set_header Referer "https://www.cnr.cn/";
      proxy_set_header Origin "https://www.cnr.cn";
      proxy_set_header Accept "*/*";
      proxy_set_header Accept-Language "zh-CN,zh;q=0.9,en;q=0.8";
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Real-IP "";
      proxy_http_version 1.1;
      proxy_buffering off;
      add_header Cache-Control "no-store";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
